name: VeriSight CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Forensic Multi-Spectral Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start FastAPI Background Daemon
        run: |
          PYTHONPATH=. python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          for i in {1..30}; do
            curl -s http://127.0.0.1:8000/api/aws-status && break || true
            echo "Waiting for FastAPI server to initialize..."
            sleep 1
          done

      - name: Run End-to-End Forensic Sanity Verification
        run: |
          PYTHONPATH=. python backend/test_sanity.py
          PYTHONPATH=. python backend/test_mcp_tools.py

  frontend-build:
    name: Frontend Next.js Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Production App
        working-directory: ./frontend
        run: npm run build
